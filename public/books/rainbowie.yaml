bookKey: 'rainbowie'
title: 'Rainbowie'
pages:
  - image: '/books/rainbowie/0-cover.webp'
    text: 'Rainbowie'
  - image: '/books/rainbowie/1.webp'
    text: 'Rainbowie was a young girl with blonde hair and blue eyes who was always dressed in rainbows. She was so happy, and she made everyone else happy too. Every room she walked into grew brighter with all her colorful rainbows.'
  - image: '/books/rainbowie/2.webp'
    text: 'Rainbowie loved to play with the other kids. She shared her toys and her snacks, and they all had so much fun together, laughing and running and filling the day with color.'
  - image: '/books/rainbowie/3.webp'
    text: 'One day a rainbow fell off her left shoe and was lost. Her foot turned dark without it, and Rainbowie was so sad. All she could think about was the missing rainbow.'
  - image: '/books/rainbowie/4.webp'
    text: 'She searched everywhere for it—in piles of toys and in the garbage—but she could not find it anywhere.'
  - image: '/books/rainbowie/5.webp'
    text: 'She looked out on the playground and down the school hallways, but the rainbow was nowhere to be found. At last she sat down and cried.'
  - image: '/books/rainbowie/6.webp'
    text: 'Far away, in a dark and grey and cold and sad world with no rainbows at all, lived a boy named Leroy. He frowned a lot and had no friends.'
  - image: '/books/rainbowie/7.webp'
    text: 'Leroy only ever watched the other kids playing from far away. In his heart he was sure they would never want to play with him.'
  - image: '/books/rainbowie/8.webp'
    text: 'One day Leroy was wandering alone among the trees when he saw something bright and shiny underneath some leaves. He brushed the leaves away and was stunned to find a rainbow there.'
  - image: '/books/rainbowie/9.webp'
    text: 'The rainbow lit up his life. Leroy felt happiness for the first time and smiled a big smile. He hugged the rainbow, tucked it in his pocket, and suddenly he was drawn in full color.'
  - image: '/books/rainbowie/10.webp'
    text: 'Leroy walked toward the other children. Now that he felt happy, he thought maybe they really would want to play with him after all. He found Rainbowie sitting and crying, and he asked her what was wrong.'
  - image: '/books/rainbowie/11.webp'
    text: 'Rainbowie told him she had lost her rainbow and was so sad because it was a special rainbow. Leroy pointed out that she still had many rainbows. Rainbowie said, "They are all special to me."'
  - image: '/books/rainbowie/12.webp'
    text: 'Leroy said, "Maybe your special rainbow is even more special to someone who has no rainbows at all." Rainbowie asked, "Do you think someone found my rainbow, so it won''t be lonely?" Leroy said, "I''m sure someone found it, and they are so happy now."'
  - image: '/books/rainbowie/13.webp'
    text: 'Rainbowie thought for a moment. "It makes me happy to share," she said, "as long as the rainbow isn''t lost and alone." Then Rainbowie and Leroy held hands and ran over to the other kids to play. They were happy—and they both had a new friend.'
