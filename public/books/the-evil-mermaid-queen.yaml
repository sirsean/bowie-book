bookKey: 'the-evil-mermaid-queen'
title: 'The Evil Mermaid Queen'
pages:
  - image: '/books/the-evil-mermaid-queen/0-cover.webp'
    text: 'The Evil Mermaid Queen'
  - image: '/books/the-evil-mermaid-queen/1.webp'
    text: 'On a picturesque beach with soft yellow sand stood an old wooden sign. Through vines and leaves and sticks, people could only read one exciting word: "Mermaids!"'
  - image: '/books/the-evil-mermaid-queen/2.webp'
    text: 'But the sign really said "Caution: Evil Mermaids!" The vines covered the warning, so visitors hurried into the sparkling water, eager to meet mermaids.'
  - image: '/books/the-evil-mermaid-queen/3.webp'
    text: 'Under the waves waited the Evil Mermaid Queen. With a big magic wand she zapped swimmers and turned them into fish and other sea creatures!'
  - image: '/books/the-evil-mermaid-queen/4.webp'
    text: 'Once they were fish, they had to do what she said. She sent them hunting for undersea treasures and made them bring every shiny prize back to her.'
  - image: '/books/the-evil-mermaid-queen/5.webp'
    text: 'The Evil Mermaid Queen loved collecting treasure. She loved being powerful over her fish even more. Mwa ha ha!'
  - image: '/books/the-evil-mermaid-queen/6.webp'
    text: 'One day a girl with blonde hair named Bowie came to the beach. She had heard about the mermaids—but she peeled back the vines and read the whole sign.'
  - image: '/books/the-evil-mermaid-queen/7.webp'
    text: 'Bowie was the first one to know the truth. These were not nice mermaids. These were bad mermaids!'
  - image: '/books/the-evil-mermaid-queen/8.webp'
    text: 'Bowie took her special magic wand and waded into the water. Zap! She turned herself into a mermaid.'
  - image: '/books/the-evil-mermaid-queen/9.webp'
    text: 'Mermaid Bowie had big magenta-and-blue hair flowing in the water. Her green fin sparkled with rainbows as she swam down toward the queen''s lair.'
  - image: '/books/the-evil-mermaid-queen/10.webp'
    text: 'The Evil Mermaid Queen sent armies of fish at Mermaid Bowie. But Bowie waved her wand and turned them back into people. They swam up to the surface and back to shore!'
  - image: '/books/the-evil-mermaid-queen/11.webp'
    text: 'Then Mermaid Bowie and the Evil Mermaid Queen fought with magic. They zapped and zapped! Bowie''s magic was so strong she did not turn into a fish.'
  - image: '/books/the-evil-mermaid-queen/12.webp'
    text: 'When Bowie zapped the Evil Mermaid Queen, the queen shrank and shrank until she could not hold up her wand anymore. She became a regular small mermaid—and she became nice!'
  - image: '/books/the-evil-mermaid-queen/13.webp'
    text: 'Bowie and the Nice Mermaid swam back to shore together. On the beach, Bowie became a human again and put up a brand-new sign that said "Nice Mermaid!"'
  - image: '/books/the-evil-mermaid-queen/14.webp'
    text: 'At sunset, everyone had a big fun beach party. The Nice Mermaid waved from the water while the people played and laughed. What a happy day!'
