bookKey: 'the-evil-halloween-queen'
title: 'The Evil Halloween Queen'
pages:
  - image: '/books/the-evil-halloween-queen/0-cover.webp'
    text: 'The Evil Halloween Queen'
  - image: '/books/the-evil-halloween-queen/1.webp'
    text: 'In a spooky, sparkly place called Halloween Town lived the Evil Halloween Queen. All summer she had to hide there, because it was too hot—even at night!'
  - image: '/books/the-evil-halloween-queen/2.webp'
    text: 'The Halloween Queen loved spooky things. She liked to turn people into scary monsters that lived with her in Halloween Town.'
  - image: '/books/the-evil-halloween-queen/3.webp'
    text: 'She had helpers called the Vamghoston. The Vamghoston was a vampire, a ghost, and a skeleton standing side by side. They always did everything together.'
  - image: '/books/the-evil-halloween-queen/4.webp'
    text: 'Bowie got home from school so excited to go trick-or-treating. She had been waiting all year for Halloween, and it was finally here!'
  - image: '/books/the-evil-halloween-queen/5.webp'
    text: 'Zap! Bowie waved her Halloween Wand and converted into Halloween Bowie. She had been planning her costume for months, and it would help charge up her magic Halloween powers.'
  - image: '/books/the-evil-halloween-queen/6.webp'
    text: 'That same night, the Vamghoston were out. They saw someone coming up to them trick-or-treating, and they walked right up.'
  - image: '/books/the-evil-halloween-queen/7.webp'
    text: 'The skeleton grabbed the trick-or-treater and put them in the vampire''s hands. The vampire sucked all their blood and gave them to the ghost, who gobbled them up to Halloween Town!'
  - image: '/books/the-evil-halloween-queen/8.webp'
    text: 'When Halloween Bowie saw them doing that, the skeleton grabbed her too. The skeleton accidentally gobbled her up to Halloween Town—but the vampire forgot to suck her blood!'
  - image: '/books/the-evil-halloween-queen/9.webp'
    text: 'Halloween Bowie landed in Halloween Town still herself. She waved her Halloween Wand and turned the Halloween creatures back into humans, then sent them home to the world.'
  - image: '/books/the-evil-halloween-queen/10.webp'
    text: 'Then Halloween Bowie fought the Evil Halloween Queen. Bowie tried to zap the queen with her wand—but the queen zapped the magic right off Bowie!'
  - image: '/books/the-evil-halloween-queen/11.webp'
    text: 'All the pumpkins and jack-o-lanterns shook and bounced. Halloween Bowie was so strong that the Halloween Queen could not hurt her.'
  - image: '/books/the-evil-halloween-queen/12.webp'
    text: 'The queen shrank and shrank until she turned into a Nice Halloween Queen. All the scary monsters shrank too, and they turned into toys for people to play with.'
  - image: '/books/the-evil-halloween-queen/13.webp'
    text: 'The Vamghoston turned into toys as well! After that, the toys turned back into monsters only on Halloween night and were scary, and then they turned back into toys again.'
  - image: '/books/the-evil-halloween-queen/14.webp'
    text: 'Even when they were monsters, the Vamghoston did not suck people''s blood anymore. The vampire only said "Hi," and the ghost said "Goodbye," then gobbled them up and ghost-pooped them back to their house.'
  - image: '/books/the-evil-halloween-queen/15.webp'
    text: 'And Bowie loved having fun on Halloween. What a happy Halloween night!'
